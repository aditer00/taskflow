{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-[#ffffff] text-[#37352f] min-h-screen antialiased overflow-x-hidden">
    <header class="bg-[#ffffff] border-b border-[#e5e3df]">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-6">
                <a href="/projects" class="inline-flex items-center gap-2.5 min-h-[44px] font-semibold text-base tracking-[-0.02em] text-[#1a1a1a]">
                    <span class="w-6 h-6 rounded-[6px] bg-[#0a1530] text-[#ffffff] font-mono text-xs font-semibold inline-flex items-center justify-center shrink-0" aria-hidden="true">T</span>
                    <span>TaskFlow</span>
                </a>
                {{if .User}}
                <nav aria-label="Primary" class="hidden sm:flex items-center gap-1">
                    <a href="/projects" class="inline-flex items-center min-h-[44px] px-3 text-sm font-medium rounded-[6px] text-[#1a1a1a] bg-[#f6f5f4]">
                        Projects
                    </a>
                </nav>
                {{end}}
            </div>

            <div class="flex items-center gap-2 sm:gap-3 text-sm">
                <a href="/health" target="_blank"
                    class="inline-flex items-center min-h-[44px] px-2.5 font-mono text-xs text-[#5d5b54] hover:text-[#1a1a1a] rounded-[6px]">
                    /health
                </a>
                {{if .User}}
                    <span class="hidden sm:inline text-xs font-medium text-[#5d5b54] border-l border-[#e5e3df] pl-3">
                        {{.User.Name}}
                    </span>
                    <form method="POST" action="/logout">
                        <button type="submit"
                            class="inline-flex items-center min-h-[44px] px-3.5 text-sm font-medium text-[#1a1a1a] border border-[#c8c4be] hover:bg-[#f6f5f4] rounded-[8px] cursor-pointer">
                            Logout
                        </button>
                    </form>
                {{else}}
                    <a href="/login" class="inline-flex items-center min-h-[44px] px-3 text-sm font-medium text-[#1a1a1a] hover:bg-[#f6f5f4] rounded-[8px]">
                        Sign in
                    </a>
                    <a href="/register" class="inline-flex items-center min-h-[44px] px-4 text-sm font-medium text-[#ffffff] bg-[#0075de] hover:bg-[#005bab] rounded-[8px]">
                        Get started
                    </a>
                {{end}}
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
